<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraç Korkmaz - Portfolyo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('bg.jpg') center/cover no-repeat fixed;
            background-color: #121212; 
            color: #fff;
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Ana Buzlu Cam (Glassmorphism) Efekti */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* Sol Kenar Çubuğu (Sidebar) */
        .sidebar {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            flex-shrink: 0;
        }

        .sidebar-logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: auto;
            letter-spacing: 1px;
        }

        .social-icons {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: auto;
        }

        .social-icons a {
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-icons a:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .social-icons svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* Ana İçerik Alanı */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Üst Terminal Animasyon Kartı */
        .hero-card {
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }
